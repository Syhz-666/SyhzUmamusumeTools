name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build for release
        type: string
        required: true
    outputs:
      commit:
        description: Commit used to build the tested installer
        value: ${{ jobs.windows.outputs.commit }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Check build version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -cne $version -or $lock.packages[''].version -cne $version) {
            throw 'package.json and package-lock.json versions must match'
          }
          if ($env:TAG -and $env:TAG -cne "v$version") {
            throw "Tag $env:TAG does not match package version v$version"
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Building v$version from $commit"
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js
      - run: npm run pack -- --publish never

      - name: Install, verify persistence, and uninstall
        id: installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "release/SyhzUmamusumeTools-$env:VERSION-x64-Setup.exe"
          $before = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          ./scripts/test-installer.ps1 -Setup $setup
          $after = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($before -cne $after) { throw 'The installer changed during testing' }
          "sha256=$after" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        if: inputs.tag != ''
        with:
          python-version: '3.11'

      - name: Package source and record checksums
        if: inputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SETUP_SHA256: ${{ steps.installer.outputs.sha256 }}
        run: |
          python scripts/package-source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "SyhzUmamusumeTools-$env:VERSION-x64-Setup.exe"
          $source = "SyhzUmamusumeTools-$env:VERSION-source.zip"
          $sourceHash = (Get-FileHash -LiteralPath "release/$source" -Algorithm SHA256).Hash
          @("$env:SETUP_SHA256  $setup", "$sourceHash  $source") |
            Set-Content -LiteralPath "release/SHA256SUMS-$env:VERSION.txt" -Encoding ascii

      - uses: actions/upload-artifact@v6
        if: inputs.tag != ''
        with:
          name: windows-release
          path: |
            release/SyhzUmamusumeTools-${{ steps.version.outputs.version }}-x64-Setup.exe
            release/SyhzUmamusumeTools-${{ steps.version.outputs.version }}-source.zip
            release/SHA256SUMS-${{ steps.version.outputs.version }}.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: true
